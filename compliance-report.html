<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
  const content = $("content");

  // FIX: this always prefixed "$" regardless of the property's own
  // currency — a Business customer's Compliance/Audit Report for a
  // France/Spain/UK property showed dollar signs on euro/pound figures.
  // Same currencyForCountry() mapping engine.js/report.html already use
  // (this page has no shared module, same duplication pattern report.html
  // already follows for its own money()/n() helpers).
  // The currency a property is priced in there — the currency of the
  // official benchmark the report compares with. Serbia, Peru and Uruguay:
  // the official price statistics (RGZ, BCRP, INE) and the market itself
  // quote EUR/USD, so the form asks for EUR/USD (Sept 2026: Poland, Czech
  // Republic, Hungary, Japan… fell back to EUR while their benchmarks are in
  // PLN/CZK/HUF/JPY — the "asking vs market" figure was wrong). Keep the
  // three copies (engine.js, compliance-report.html, business-portfolio.html)
  // identical.
  const COUNTRY_CURRENCY = {
    "united states": "USD", usa: "USD", us: "USD", "puerto rico": "USD", ecuador: "USD", cambodia: "USD",
    "united kingdom": "GBP", uk: "GBP", denmark: "DKK", sweden: "SEK", norway: "NOK", iceland: "ISK",
    switzerland: "CHF", liechtenstein: "CHF", poland: "PLN", "czech republic": "CZK", czechia: "CZK",
    hungary: "HUF", romania: "RON", moldova: "MDL", ukraine: "UAH", belarus: "BYN", russia: "RUB",
    serbia: "EUR", "bosnia and herzegovina": "BAM", "north macedonia": "MKD", albania: "ALL",
    turkey: "TRY", georgia: "GEL", armenia: "AMD", azerbaijan: "AZN", kazakhstan: "KZT", kyrgyzstan: "KGS",
    tajikistan: "TJS", turkmenistan: "TMT", uzbekistan: "UZS",
    israel: "ILS", "united arab emirates": "AED", egypt: "EGP", morocco: "MAD", "south africa": "ZAR", kenya: "KES", nigeria: "NGN",
    india: "INR", "sri lanka": "LKR", maldives: "MVR", thailand: "THB", vietnam: "VND", indonesia: "IDR",
    japan: "JPY", "south korea": "KRW", australia: "AUD", "new zealand": "NZD",
    canada: "CAD", mexico: "MXN", brazil: "BRL", argentina: "ARS", chile: "CLP", colombia: "COP", peru: "USD",
    uruguay: "USD", paraguay: "PYG", bolivia: "BOB", "dominican republic": "DOP", jamaica: "JMD",
    "trinidad and tobago": "TTD", bahamas: "BSD", barbados: "BBD", "cayman islands": "KYD"
  };
  function currencyForCountry(country) {
    return COUNTRY_CURRENCY[String(country || "").trim().toLowerCase()] || "EUR";
  }
  function money(v, currency = "USD") {
    const n = Number(v);
    if (!Number.isFinite(n)) return "—";
    try { return new Intl.NumberFormat("en-US", { style: "currency", currency, maximumFractionDigits: 0 }).format(n); }
    catch { return "$" + Math.round(n).toLocaleString("en-US"); }
  }

  function nowStamp() {
    return new Date().toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  // Single-property mode: reads the exact same pradixiumReportData that
  // report.html itself renders from (see engine.js's buildReportData()) —
  // no separate data plumbing, so every figure here is identical to what
  // the paid report already showed, just laid out for an audit trail.
  function renderSingle(data) {
    const sources = [
      ["Market Benchmark", data.marketSource],
      ["Buyer Demand", data.demandSource],
      ["Foreign Buyer Access", data.foreignAccessSource],
      ["Closing Costs", data.closingCostsSource],
      ["Annual Property Tax", data.propertyTaxSource],
      ["Currency Controls", data.currencyControlsSource]
    ].filter(([, v]) => v && v !== "—");

    const currency = data.currency || currencyForCountry(data.country);
    const evidenceRows = [
      ["Asking Price", money(data.askingPrice, currency)],
      ["Size", data.size ? data.size + " m²" : "—"],
      ["Pradixium Score", data.score != null ? data.score + "/100" : "—"],
      ["Deal Rating", data.dealRating || "—"],
      ["Confidence", data.confidence || "—"],
      ["Government/Market Benchmark", data.governmentBenchmark || "—"],
      ["Government Value", data.governmentValue || "—"],
      ["Transaction Value", data.transactionValue || "—"],
      ["Transaction Period", data.transactionPeriod || "—"],
      ["Market Area", data.marketArea || "—"],
      ["Foreign Buyer Access Status", data.foreignAccessStatus || "—"],
      ["Pradixium Reality Check™ Verdict", data.realityCheck?.verdict || "—"]
    ];

    content.innerHTML =
      `<div class="meta">
        <div><strong>${esc(data.analysisReference || "—")}</strong>Analysis Reference</div>
        <div><strong>${esc(nowStamp())}</strong>Generated</div>
        <div><strong>${esc(data.watermarkEmail || "—")}</strong>Prepared For</div>
        <div><strong>${esc(data.watermarkBusinessCompanyName || "Pradixium account")}</strong>Account</div>
      </div>
      <div class="property-block">
        <h2>${esc(data.title || "Property")}</h2>
        <p class="property-sub">${esc(data.city || "")}${data.city && data.country ? ", " : ""}${esc(data.country || "")}</p>
        <table><tbody>
          ${evidenceRows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}
        </tbody></table>
      </div>
      <div class="sources-index">
        <h2>Sources &amp; Citations</h2>
        <ul>${sources.map(([label, src]) => `<li><strong>${esc(label)}:</strong> ${esc(src)}</li>`).join("") || "<li>No sourced figures were available for this property.</li>"}</ul>
      </div>`;
  }

  // Portfolio mode: business-portfolio.html stores the full raw
  // api/orchestrator.js response per property (not the display-formatted
  // engine.js version single mode uses above) — same underlying source
  // fields, slightly different shape, so this reads them directly.
  function renderPortfolio(items) {
    const allSources = [];
    const blocks = items.map((item, i) => {
      const p = item.property || {};
      const evidence = item.marketEvidence || {};
      const score = item.pradixiumScore || {};
      const fba = item.foreignBuyerAccess || {};
      const cc = item.closingCosts || {};
      const pt = item.propertyTax || {};
      const ctrl = item.currencyControls || {};
      const rc = item.realityCheck || {};

      const rowSources = [
        ["Market Benchmark", evidence.source],
        ["Foreign Buyer Access", fba.source],
        ["Closing Costs", cc.source || cc.sourceUrl],
        ["Annual Property Tax", pt.source || pt.sourceUrl],
        ["Currency Controls", ctrl.source]
      ].filter(([, v]) => v);
      rowSources.forEach(([, v]) => { if (!allSources.includes(v)) allSources.push(v); });

      const currency = currencyForCountry(p.country);
      const rows = [
        ["Asking Price", money(p.price, currency)],
        ["Size", p.size ? p.size + " m²" : "—"],
        ["Pradixium Score", Number.isFinite(Number(score.score)) ? Math.round(Number(score.score)) + "/100" : "—"],
        ["Confidence", score.confidence || "—"],
        ["Market Benchmark", evidence.benchmarkValue != null ? money(evidence.benchmarkValue, currency) + (evidence.benchmarkUnit === "perSqm" ? "/m²" : "") : "—"],
        ["Foreign Buyer Access Status", fba.status || "—"],
        ["Pradixium Reality Check™ Verdict", rc.verdict || "—"]
      ];

      return `<div class="property-block">
        <h2>${i + 1}. ${esc(p.address || p.city || "Property")}</h2>
        <p class="property-sub">${esc(p.city || "")}${p.city && p.country ? ", " : ""}${esc(p.country || "")}</p>
        <table><tbody>${rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table>
        ${rowSources.length ? `<div style="font-size:11px;color:#8994a3;margin-top:6px">${rowSources.map(([l, v]) => esc(l) + ": " + esc(v)).join(" · ")}</div>` : ""}
      </div>`;
    }).join("");

    content.innerHTML =
      `<div class="meta">
        <div><strong>${esc(items.length)}</strong>Properties Analyzed</div>
        <div><strong>${esc(nowStamp())}</strong>Generated</div>
      </div>
      ${blocks}
      <div class="sources-index">
        <h2>Sources &amp; Citations Index</h2>
        <ul>${allSources.map((s) => `<li>${esc(s)}</li>`).join("") || "<li>No sourced figures were available for this portfolio.</li>"}</ul>
      </div>`;
  }

  let rendered = false;
  try {
    const portfolioRaw = localStorage.getItem("pradixiumPortfolioResults");
    if (portfolioRaw) {
      const items = JSON.parse(portfolioRaw);
      if (Array.isArray(items) && items.length) { renderPortfolio(items); rendered = true; }
    }
  } catch (e) {}
  if (!rendered) {
    try {
      const single = JSON.parse(localStorage.getItem("pradixiumReportData") || "null");
      if (single) { renderSingle(single); rendered = true; }
    } catch (e) {}
  }
  if (!rendered) {
    content.innerHTML = '<p class="empty">No analysis data found. Open this from a report or a completed portfolio run.</p>';
  }

  content.innerHTML += '<p class="disclaimer">This document lists the official/government and market sources Pradixium cites for each figure above, as gathered at the time of generation. It is a record of the evidence used, not independent verification, legal advice, or a guarantee of accuracy — figures should be confirmed against the cited source or a qualified local professional before being relied on for a transaction, filing, or regulatory submission.</p>';
})();
</script>
</body>
</html>
